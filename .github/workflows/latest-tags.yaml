name: Latest Tags

on:
  workflow_dispatch:
    inputs:
      network:
        description: Which network are we updating the latest tag information?
        required: true
        type: choice
        options:
          - mainnet
          - mocha
  schedule:
    - cron: '0 */6 * * *'
  # Regenerate the other network's PR after a constants merge.
  push:
    branches: [main]
    paths:
      - constants/*_versions.json

permissions:
  contents: read

jobs:
  syncLatestTags:
    name: Sync latest tags (${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.network) || '["mainnet","mocha"]') }}
    concurrency:
      group: latest-tags-${{ matrix.network }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      OWNER: celestiaorg
      NETWORK: ${{ matrix.network }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Queued push runs must regenerate from current main, not the event SHA.
          ref: main

      - name: Fetch latest tags and commit SHAs
        id: latest
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const { pathToFileURL } = require('node:url');
            const root = process.env.GITHUB_WORKSPACE;
            const { planUpdates } = await import(pathToFileURL(path.join(root, 'scripts/latest-tags.mjs')).href);
            const network = process.env.NETWORK;
            const versionsPath = path.join(root, 'constants', `${network}_versions.json`);
            const current = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
            const result = await planUpdates({ github, owner: process.env.OWNER, network, current });
            await core.summary.addHeading(`Release selection: ${network}`)
              .addCodeBlock(result.summary.join('\n'))
              .addRaw(result.changed ? 'Newer release found; review compatibility before merging.' : 'No eligible tag update; checking bundled Node API specs.')
              .write();
            if (result.changed) {
              fs.writeFileSync(versionsPath, JSON.stringify(result.next, null, 2) + '\n');
            }
            core.setOutput('selection_summary', result.summary.join('\n'));

      - name: Sync bundled Node API specs and skill links
        run: |
          node scripts/sync-node-api.mjs
          node scripts/sync-skill.mjs
          node scripts/sync-skill.mjs --check

      # Also repairs spec drift when the selected release tags have not changed.
      # create-pull-request is a no-op when the checkout has no changes.
      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: gh-action/latest-tags-${{ matrix.network }}
          commit-message: "[automated GH action] sync release versions and Node API specs (${{ matrix.network }})"
          title: "[GH Action] Sync release versions and Node API specs for ${{ matrix.network }}"
          body: |
            Proposes newer releases for ${{ matrix.network }} using numeric major/minor/patch ordering.
            Includes matching Node API specs and generated skill links, and repairs API version drift even without a new release.
            Mainnet uses stable releases; Mocha uses only `-mocha` releases.

            Review upstream release notes and network compatibility before merging, especially for major/minor upgrades. A published binary does not establish network activation.

            ```text
            ${{ steps.latest.outputs.selection_summary }}
            ```
          token: ${{ secrets.PAT_CREATE_PR }}
