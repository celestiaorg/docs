name: Latest Tags

on:
  workflow_dispatch:
    inputs:
      network:
        description: Which network are we updating the latest tag information?
        required: true
        type: choice
        options:
          - mainnet
          - mocha
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  syncLatestTags:
    name: Sync latest tags (${{ matrix.network }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.network) || '["mainnet","mocha"]') }}
    permissions:
      contents: write
      pull-requests: write
    env:
      OWNER: celestiaorg
      NETWORK: ${{ matrix.network }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest tags and commit SHAs
        id: latest
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const { pathToFileURL } = require('node:url');
            const root = process.env.GITHUB_WORKSPACE;
            const { planUpdates } = await import(pathToFileURL(path.join(root, 'scripts/latest-tags.mjs')).href);
            const network = process.env.NETWORK;
            const versionsPath = path.join(root, 'constants', `${network}_versions.json`);
            const current = JSON.parse(fs.readFileSync(versionsPath, 'utf8'));
            const policy = JSON.parse(fs.readFileSync(path.join(root, 'constants/release-policy.json'), 'utf8'));
            const result = await planUpdates({ github, owner: process.env.OWNER, network, current, policy });
            await core.summary.addHeading(`Release selection: ${network}`)
              .addCodeBlock(result.summary.join('\n'))
              .addRaw(result.changed ? 'Eligible patch update found.' : 'No eligible update; no PR created.')
              .write();
            if (result.changed) {
              fs.writeFileSync(versionsPath, JSON.stringify(result.next, null, 2) + '\n');
            }
            core.setOutput('should_update', String(result.changed));

      - name: Open PR
        if: steps.latest.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: gh-action/latest-tags-${{ matrix.network }}
          commit-message: "[automated GH action] update latest release tags & commit sha (${{ matrix.network }})"
          title: "[GH Action] Update release tags and commit SHAs for ${{ matrix.network }}"
          token: ${{ secrets.PAT_CREATE_PR }}
