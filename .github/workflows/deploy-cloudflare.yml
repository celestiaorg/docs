name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'celestia-docs' }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the Cloudflare API token repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the Cloudflare account ID repository secret}"
          set +e
          output="$(bunx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [[ "$status" -ne 0 && "$output" != *"already exists"* ]]; then
            exit "$status"
          fi
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_PAGES_PROJECT: project } = process.env
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/${encodeURIComponent(project)}`, {
            headers: { Authorization: `Bearer ${token}` },
          })
          const body = await response.json()
          if (!response.ok || !body.success) throw new Error('Cannot verify Pages project configuration')
          if (body.result.production_branch !== 'main') throw new Error('Pages production branch must be main')
          const host = body.result.subdomain
          if (!/^[a-z0-9-]+\.pages\.dev$/.test(host)) throw new Error('Unexpected Pages project hostname')
          appendFileSync(process.env.GITHUB_ENV, `PAGES_HOST=${host}\n`)
          JS

      - name: Set deployment target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cloudflare-target.mjs

      - name: Build and verify Pages artifact
        run: |
          bun run prepare:cloudflare
          bun run test:static
          bun run test:mcp
          bun run test:cloudflare

      - name: Deploy
        id: deploy
        # cloudflare/wrangler-action v3
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy out/public --project-name ${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch ${{ env.PAGES_BRANCH }}

      - name: Verify deployed site
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/check-cloudflare-deployment.mjs "$DEPLOYMENT_URL"

      - name: Summarize deployment
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo '## Cloudflare Pages deployment'
            echo "- Branch: $PAGES_BRANCH"
            echo "- Build origin: $VOCS_BASE_URL"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Alias: $ALIAS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
