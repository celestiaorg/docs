name: Deploy PR Preview

on:
  # Retained for rollback; Cloudflare owns automatic previews.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to publish from the selected branch
        required: true
        type: number
      action:
        description: Publish or remove the legacy preview
        type: choice
        options: [publish, remove]
        default: publish

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          BASE: /docs-preview/pr-${{ inputs.pr_number }}/
        run: bun run build && bun run test:static

      - name: Checkout docs-preview repository
        uses: actions/checkout@v6
        with:
          repository: celestiaorg/docs-preview
          token: ${{ secrets.PR_PREVIEW_DEPLOY }}
          path: docs-preview

      - name: Deploy to docs-preview
        run: |
          # Create target directory
          TARGET_DIR="docs-preview/pr-${{ inputs.pr_number }}"

          # Remove existing content in target directory to ensure clean deploy
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          # Copy built files
          cp -r out/public/. "$TARGET_DIR"/

          # Ensure .nojekyll exists in root
          touch docs-preview/.nojekyll

          # Commit and Push
          cd docs-preview
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy preview for PR #${{ inputs.pr_number }} from ${{ github.sha }}"
            git pull --rebase
            git push
          fi

      - name: Post Preview Link
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(context.payload.inputs.pr_number);
            const previewUrl = `https://celestiaorg.github.io/docs-preview/pr-${prNumber}/`;
            const body = `🚀 **Preview Deployment**\n\nYour preview is ready: [${previewUrl}](${previewUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.body.includes('🚀 **Preview Deployment**') && 
              comment.user.type === 'Bot'
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

  cleanup-preview:
    if: inputs.action == 'remove'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout docs-preview repository
        uses: actions/checkout@v6
        with:
          repository: celestiaorg/docs-preview
          token: ${{ secrets.PR_PREVIEW_DEPLOY }}
          path: docs-preview

      - name: Remove preview
        run: |
          TARGET_DIR="docs-preview/pr-${{ inputs.pr_number }}"
          
          if [ -d "$TARGET_DIR" ]; then
            rm -rf "$TARGET_DIR"
            
            cd docs-preview
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Remove preview for PR #${{ inputs.pr_number }}"
            git pull --rebase
            git push
          else
            echo "Preview directory $TARGET_DIR does not exist, skipping cleanup."
          fi
